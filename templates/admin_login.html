<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - CampusBite</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        CampusBite Admin
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
    </div>

</nav>


<section class="cart-section">

    <div class="cart-container">

        <h1>Admin Login</h1>

        {% if error %}
            <p style="color: red;">
                {{ error }}
            </p>
        {% endif %}

        <form action="/admin/login" method="POST">

            <p>
                <label>Username</label>
            </p>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <br><br>

            <p>
                <label>Password</label>
            </p>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <br><br>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</section>


<footer class="footer">

    <h2>CampusBite</h2>

    <p>
        Smart • Fast • Easy Canteen Ordering
    </p>

    <p>
        © 2026 CampusBite. All Rights Reserved.
    </p>

</footer>

</body>
</html>
