<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CampusBite</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="login-brand">
                🍴
            </div>

            <h1>Welcome Back!</h1>

            <p>
                Login to CampusBite and order your
                favourite food quickly and easily.
            </p>

            <div class="login-features">

                <div>
                    <span>🍔</span>
                    <p>Delicious Food</p>
                </div>

                <div>
                    <span>⚡</span>
                    <p>Fast Ordering</p>
                </div>

                <div>
                    <span>📦</span>
                    <p>Easy Tracking</p>
                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-box">

                <div class="login-title">

                    <h2>Login</h2>

                    <p>
                        Enter your account details
                    </p>

                </div>


                <form action="/login" method="POST">

                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <span>📧</span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <span>🔒</span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button type="submit"
                            class="modern-login-btn">

                        Login to Account →

                    </button>

                </form>


                <!-- REGISTER -->

                <div class="register-link">

                    <p>
                        Don't have an account?
                        <a href="/register">
                            Create Account
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>


    <footer class="login-footer">
        © 2026 CampusBite • Smart • Fast • Easy
    </footer>

</body>

</html>
